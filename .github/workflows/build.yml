name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyinstaller

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Build EXE
        run: pyinstaller --noconfirm --onedir --name KavirTireBot --add-data "$env:LOCALAPPDATA/ms-playwright;pw-browsers" kavirtirebot_windowsbuild/KoVirTireBot.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: KavirTireBot-Windows
          path: dist/
